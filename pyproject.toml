[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-slide-video"
version = "0.1.0"
description = "主题/文案 -> 5 张统一风格画面 -> 逐页配音 -> MP4"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=11.0",
  "edge-tts>=7.0",
  "imageio-ffmpeg>=0.6.0",
  "fastapi>=0.115",
  "uvicorn>=0.32",
]

[project.scripts]
ai-video = "ai_video.cli:main"
ai-video-web = "ai_video.web:main"

[tool.setuptools.packages.find]
where = ["src"]

